<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNO Card Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* SCREENS */
        .screen { display: none; max-width: 500px; margin: 40px auto; padding: 30px; background: #16213e; border-radius: 16px; text-align: center; }
        .screen.active { display: block; }
        .screen h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .screen h2 { font-size: 1.5rem; margin-bottom: 15px; }
        .screen input, .screen select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 1rem; background: #0f3460; color: #fff; }
        .screen input::placeholder { color: #888; }
        .btn { padding: 12px 24px; margin: 8px 4px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: bold; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #e94560; color: #fff; }
        .btn-secondary { background: #533483; color: #fff; }
        .btn-full { width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 15px; }
        .btn-small { padding: 8px 16px; font-size: 0.85rem; }

        /* LOBBY */
        .room-code { font-size: 2.5rem; font-weight: bold; letter-spacing: 8px; color: #e94560; background: #0f3460; padding: 15px; border-radius: 10px; margin: 15px 0; user-select: all; }
        .player-list { text-align: left; margin: 15px 0; }
        .player-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; margin: 5px 0; background: #0f3460; border-radius: 8px; }
        .waiting { color: #aaa; font-style: italic; margin: 10px 0; }
        .share-hint { font-size: 0.85rem; color: #aaa; margin: 10px 0; }

        /* GAME BOARD */
        .game-screen { display: none; padding: 15px; max-width: 1000px; margin: 0 auto; }
        .game-screen.active { display: block; }

        /* CIRCULAR TABLE */
        .table-area { position: relative; width: 100%; max-width: 500px; height: 340px; margin: 0 auto 10px; }
        .felt-table { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 220px; border-radius: 50%; background: radial-gradient(ellipse, #2d6b3f, #1b4d2e); border: 10px solid #5c3a1e; box-shadow: 0 0 0 3px #3d2510, 0 10px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.3); }
        .direction-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; height: 200px; border-radius: 50%; border: 2px dashed rgba(255,255,255,0.15); pointer-events: none; }
        .direction-arrow { position: absolute; color: rgba(255,255,255,0.4); font-size: 1rem; }
        .direction-arrow.cw-top { top: -2px; left: 50%; transform: translateX(-50%); }
        .direction-arrow.cw-right { right: -2px; top: 50%; transform: translateY(-50%); }
        .direction-arrow.cw-bottom { bottom: -2px; left: 50%; transform: translateX(-50%); }
        .direction-arrow.cw-left { left: -2px; top: 50%; transform: translateY(-50%); }

        /* Cards in center of table */
        .table-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 10px; align-items: center; }
        .deck-pile { position: relative; cursor: pointer; }
        .deck-card { width: 60px; height: 90px; background: #1a1a1a; border-radius: 8px; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; position: relative; overflow: hidden; font-weight: bold; font-family: 'Arial Black', sans-serif; }
        .deck-card::before { content: ''; position: absolute; width: 110%; height: 60%; background: #ed1c24; border-radius: 50%; transform: rotate(-10deg); }
        .deck-card::after { content: 'UNO'; position: relative; z-index: 2; font-size: 0.85rem; color: #f8d80e; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); letter-spacing: 1px; }
        .deck-card:hover { transform: scale(1.08); }
        .deck-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .deck-card.disabled:hover { transform: none; }
        .deck-count { position: absolute; bottom: -14px; width: 100%; text-align: center; font-size: 0.6rem; color: #aaa; }
        .top-card { width: 60px; height: 90px; border-radius: 8px; border: 2px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.5); position: relative; overflow: hidden; }

        /* Player seats around table */
        .seat { position: absolute; text-align: center; transition: all 0.3s; z-index: 5; }
        .seat-top { top: 0; left: 50%; transform: translateX(-50%); }
        .seat-left { left: 5px; top: 50%; transform: translateY(-50%); }
        .seat-right { right: 5px; top: 50%; transform: translateY(-50%); }
        .seat-bottom { bottom: 0; left: 50%; transform: translateX(-50%); }
        .seat-info { background: #16213e; padding: 6px 12px; border-radius: 10px; border: 2px solid #333; white-space: nowrap; font-size: 0.75rem; position: relative; }
        .seat-info.active-turn { border-color: #4caf50; box-shadow: 0 0 12px #4caf50; }
        .seat-info.finished { opacity: 0.5; border-color: #f8d80e; }
        .seat-info.is-you { border-color: #e94560; box-shadow: 0 0 8px rgba(233,69,96,0.4); }
        .seat-info .seat-name { font-weight: bold; font-size: 0.7rem; }
        .seat-info .seat-cards { font-size: 1rem; font-weight: bold; color: #e94560; }
        .seat-info .rank-badge { position: absolute; top: -8px; right: -8px; background: #f8d80e; color: #333; width: 18px; height: 18px; border-radius: 50%; font-size: 0.6rem; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* HAND */
        .hand-area { margin-top: 20px; text-align: center; }
        .hand-label { font-size: 1rem; margin-bottom: 8px; color: #aaa; }
        .hand { display: flex; justify-content: center; flex-wrap: wrap; padding: 10px 0; }
        .card { width: 80px; height: 120px; border-radius: 8px; border: 3px solid #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; transition: all 0.3s ease; margin: 0 -10px; position: relative; transform: translateY(0); box-shadow: 2px 4px 10px rgba(0,0,0,0.4); overflow: hidden; }
        .card::before { content: ''; position: absolute; width: 110%; height: 60%; background: rgba(255,255,255,0.92); border-radius: 50%; transform: rotate(-10deg); }
        .card:hover { transform: translateY(-30px) scale(1.2); z-index: 10; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .card.playable { border-color: #4caf50; animation: pulse 1.5s infinite; cursor: pointer; }
        .card.playable:hover { animation: none; border-color: #fff; }
        .card.disabled { opacity: 0.45; cursor: default; }
        .card.disabled:hover { transform: translateY(0) scale(1); box-shadow: 2px 4px 10px rgba(0,0,0,0.4); }
        .card .card-value { font-size: 1.8rem; position: relative; z-index: 2; text-shadow: 2px 2px 0 rgba(0,0,0,0.2); }
        .card .card-type { font-size: 0.55rem; position: relative; z-index: 2; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card .card-corner { position: absolute; font-size: 0.65rem; font-weight: bold; z-index: 2; }
        .card .card-corner.tl { top: 5px; left: 6px; }
        .card .card-corner.br { bottom: 5px; right: 6px; transform: rotate(180deg); }

        @keyframes pulse { 0%,100% { box-shadow: 0 0 8px #4caf50; } 50% { box-shadow: 0 0 25px #4caf50, 0 0 50px rgba(76,175,80,0.3); } }

        /* COLORS - UNO authentic */
        .color-Red { background: #ed1c24; color: #fff; }
        .color-Red::before { background: rgba(255,255,255,0.9); }
        .color-Blue { background: #0956bf; color: #fff; }
        .color-Blue::before { background: rgba(255,255,255,0.9); }
        .color-Green { background: #379711; color: #fff; }
        .color-Green::before { background: rgba(255,255,255,0.9); }
        .color-Yellow { background: #f8d80e; color: #333; }
        .color-Yellow::before { background: rgba(255,255,255,0.9); }
        .color-Wild { background: #1a1a1a; color: #fff; }
        .color-Wild::before { background: linear-gradient(135deg, #ed1c24 25%, #0956bf 25%, #0956bf 50%, #379711 50%, #379711 75%, #f8d80e 75%); opacity: 0.85; }

        /* Top card UNO style */
        .top-card::before { content: ''; position: absolute; width: 110%; height: 60%; background: rgba(255,255,255,0.9); border-radius: 50%; transform: rotate(-10deg); }
        .top-card .card-value, .top-card .card-type { position: relative; z-index: 2; }

        /* COLOR PICKER */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
        .overlay.active { display: flex; }
        .color-options { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 30px; background: #16213e; border-radius: 16px; }
        .color-options h2 { grid-column: span 2; text-align: center; }
        .color-btn { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; transition: transform 0.2s; margin: 0 auto; }
        .color-btn:hover { transform: scale(1.2); }
        .color-btn.red { background: #d32f2f; }
        .color-btn.blue { background: #1565c0; }
        .color-btn.green { background: #2e7d32; }
        .color-btn.yellow { background: #f9a825; }

        /* MESSAGES */
        .messages { max-width: 600px; margin: 10px auto; padding: 10px; background: #16213e; border-radius: 10px; max-height: 100px; overflow-y: auto; font-size: 0.85rem; }
        .messages p { padding: 2px 0; border-bottom: 1px solid #0f3460; }

        /* CHAT */
        .chat-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; border-radius: 50%; background: #533483; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 50; transition: transform 0.2s; }
        .chat-toggle:hover { transform: scale(1.1); }
        .chat-toggle .badge { position: absolute; top: -2px; right: -2px; width: 18px; height: 18px; background: #e94560; border-radius: 50%; font-size: 0.65rem; display: flex; align-items: center; justify-content: center; display: none; }
        .chat-toggle .badge.show { display: flex; }
        .chat-box { position: fixed; bottom: 80px; right: 20px; width: 300px; max-height: 400px; background: #16213e; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); z-index: 50; display: none; flex-direction: column; overflow: hidden; }
        .chat-box.active { display: flex; }
        .chat-header { padding: 12px 15px; background: #533483; font-weight: bold; font-size: 0.95rem; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; max-height: 280px; min-height: 150px; }
        .chat-msg { margin-bottom: 8px; font-size: 0.85rem; }
        .chat-msg .chat-name { font-weight: bold; color: #4caf50; }
        .chat-msg .chat-name.me { color: #e94560; }
        .chat-msg .chat-text { color: #ddd; margin-top: 2px; }
        .chat-input-area { display: flex; border-top: 1px solid #0f3460; }
        .chat-input-area input { flex: 1; padding: 10px 12px; border: none; background: #0f3460; color: #fff; font-size: 0.9rem; outline: none; }
        .chat-input-area button { padding: 10px 15px; border: none; background: #e94560; color: #fff; cursor: pointer; font-weight: bold; }
        @media (max-width: 600px) {
            .chat-box { width: calc(100% - 30px); right: 15px; bottom: 75px; }
        }

        /* DIRECTION & TURN */
        .game-info { display: flex; justify-content: center; gap: 20px; align-items: center; margin: 10px 0; font-size: 0.9rem; color: #aaa; }
        .turn-indicator { color: #4caf50; font-weight: bold; font-size: 1rem; }
        .not-your-turn { color: #e94560; }

        /* WINNER */
        .winner-content { text-align: center; }
        .winner-content h1 { font-size: 2.5rem; margin-bottom: 20px; }

        /* TOAST */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #e94560; padding: 12px 24px; border-radius: 8px; font-weight: bold; z-index: 300; display: none; }
        .toast.show { display: block; animation: fadeOut 3s forwards; }
        @keyframes fadeOut { 0%,70% { opacity: 1; } 100% { opacity: 0; } }

        /* MOBILE */
        @media (max-width: 600px) {
            .screen { margin: 15px; padding: 20px; }
            .card { width: 58px; height: 87px; margin: 0 -8px; }
            .card .card-value { font-size: 1.2rem; }
            .card .card-corner { font-size: 0.45rem; }
            .card:hover { transform: translateY(-20px) scale(1.15); }
            .room-code { font-size: 2rem; letter-spacing: 5px; }
            .table-area { height: 280px; }
            .felt-table { width: 220px; height: 180px; border-width: 7px; }
            .direction-ring { width: 200px; height: 160px; }
            .deck-card { width: 48px; height: 72px; }
            .deck-card::after { font-size: 0.7rem; }
            .top-card { width: 48px; height: 72px; font-size: 0.75rem; }
            .seat-info { padding: 4px 8px; font-size: 0.65rem; }
            .seat-info .seat-cards { font-size: 0.85rem; }
            .direction-arrow { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HOME SCREEN -->
<div class="screen active" id="homeScreen">
    <h1>🃏 UNO</h1>
    <input type="text" id="playerName" placeholder="Enter your name" maxlength="15">
    <button class="btn btn-primary btn-full" onclick="createRoom()">🏠 Create Room</button>
    <div style="margin: 20px 0; color: #aaa;">— or —</div>
    <input type="text" id="joinCode" placeholder="Enter Room Code" maxlength="6" style="text-transform:uppercase; text-align:center; letter-spacing:4px; font-size:1.3rem;">
    <button class="btn btn-secondary btn-full" onclick="joinRoom()">🚪 Join Room</button>
</div>

<!-- LOBBY SCREEN -->
<div class="screen" id="lobbyScreen">
    <h2>Room Lobby</h2>
    <div class="room-code" id="roomCode"></div>
    <p class="share-hint">Share this code with friends to join!</p>
    <div class="player-list" id="playerList"></div>
    <div id="hostControls" style="display:none;">
        <div style="display:flex; gap:8px; margin-top:15px;">
            <button class="btn btn-secondary btn-small" onclick="addBot()">🤖 + Bot</button>
            <button class="btn btn-secondary btn-small" onclick="removeBot()">🤖 - Bot</button>
        </div>
        <button class="btn btn-primary btn-full" onclick="startGame()">▶️ Start Game</button>
    </div>
    <p class="waiting" id="waitingMsg">Waiting for host to start...</p>
</div>

<!-- GAME SCREEN -->
<div class="game-screen" id="gameScreen">
    <div class="game-info" style="margin-bottom:5px;">
        <span id="direction">➡️ Clockwise</span>
        <span id="turnIndicator"></span>
    </div>
    <div class="table-area">
        <div class="felt-table">
            <div class="direction-ring">
                <span class="direction-arrow cw-top" id="arrTop">→</span>
                <span class="direction-arrow cw-right" id="arrRight">↓</span>
                <span class="direction-arrow cw-bottom" id="arrBottom">←</span>
                <span class="direction-arrow cw-left" id="arrLeft">↑</span>
            </div>
            <div class="table-center">
                <div class="deck-pile" onclick="drawCard()">
                    <div class="deck-card" id="deckCard"></div>
                    <div class="deck-count" id="deckCount"></div>
                </div>
                <div class="top-card" id="topCard"></div>
            </div>
        </div>
        <div id="seats"></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="hand-area">
        <div class="hand-label" id="handLabel">Your Hand</div>
        <div class="hand" id="hand"></div>
    </div>
</div>

<!-- COLOR PICKER -->
<div class="overlay" id="colorPicker">
    <div class="color-options">
        <h2>Pick a Color</h2>
        <div class="color-btn red" onclick="pickColor('Red')"></div>
        <div class="color-btn blue" onclick="pickColor('Blue')"></div>
        <div class="color-btn green" onclick="pickColor('Green')"></div>
        <div class="color-btn yellow" onclick="pickColor('Yellow')"></div>
    </div>
</div>

<!-- CHAT -->
<button class="chat-toggle" id="chatToggle" onclick="toggleChat()" style="display:none;">💬<span class="badge" id="chatBadge">0</span></button>
<div class="chat-box" id="chatBox">
    <div class="chat-header">💬 Room Chat</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
        <button onclick="sendChat()">Send</button>
    </div>
</div>

<!-- WINNER OVERLAY -->
<div class="overlay" id="winnerOverlay">
    <div class="winner-content">
        <h1 id="winnerText">🏆</h1>
        <button class="btn btn-primary" onclick="location.reload()">🔄 Play Again</button>
    </div>
</div>

<script>
const socket = io();
let roomCode = null;
let isHost = false;
let myName = '';
let pendingCardIndex = null;
let isMyTurn = false;

// --- NAVIGATION ---
function showScreen(id) {
    document.querySelectorAll('.screen, .game-screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show';
    setTimeout(() => t.className = 'toast', 3000);
}

// --- HOME ---
function createRoom() {
    myName = document.getElementById('playerName').value.trim() || 'Player';
    socket.emit('create_room', { name: myName });
}

function joinRoom() {
    myName = document.getElementById('playerName').value.trim() || 'Player';
    const code = document.getElementById('joinCode').value.trim().toUpperCase();
    if (!code) { showToast('Enter a room code!'); return; }
    socket.emit('join_room', { code: code, name: myName });
}

// --- LOBBY ---
function addBot() { socket.emit('add_bot', { code: roomCode }); }
function removeBot() { socket.emit('remove_bot', { code: roomCode }); }
function startGame() { socket.emit('start_game', { code: roomCode }); }

function renderLobby(players) {
    const list = document.getElementById('playerList');
    list.innerHTML = players.map((p, i) => 
        `<div class="player-item"><span>${p.includes('Bot') ? '🤖' : '👤'} ${p}</span>${i === 0 ? '<span style="color:#4caf50;">Host</span>' : ''}</div>`
    ).join('');
}

// --- GAME ---
function getCardSymbol(type) {
    const s = { 'Skip': '⊘', 'Reverse': '⟳', 'Draw Two': '+2', 'Wild': '✦', 'Wild Draw Four': '+4' };
    return s[type] || type;
}
function getCornerText(type) {
    const s = { 'Skip': '⊘', 'Reverse': '⟳', 'Draw Two': '+2', 'Wild': '✦', 'Wild Draw Four': '+4' };
    return s[type] || type;
}

function renderState(state) {
    isMyTurn = state.is_your_turn;

    // Seat positions based on player count (you are always bottom)
    const positions = {
        2: ['seat-top', 'seat-bottom'],
        3: ['seat-top', 'seat-left', 'seat-bottom'],
        4: ['seat-top', 'seat-left', 'seat-right', 'seat-bottom']
    };

    // Reorder seating: you at bottom, others distributed
    const others = state.seating.filter(p => !p.is_you);
    const me = state.seating.find(p => p.is_you);
    let ordered = [];
    const count = state.seating.length;
    if (count === 2) { ordered = [others[0], me]; }
    else if (count === 3) { ordered = [others[0], others[1], me]; }
    else { ordered = [others[0], others[1], others[2], me]; }

    const pos = positions[count] || positions[4];
    const seatsDiv = document.getElementById('seats');
    seatsDiv.innerHTML = ordered.map((p, i) => {
        let cls = 'seat-info';
        if (p.is_current) cls += ' active-turn';
        if (p.finished) cls += ' finished';
        if (p.is_you) cls += ' is-you';
        const icon = p.is_you ? '🧑' : (p.is_ai ? '🤖' : '👤');
        const name = p.is_you ? 'You' : p.name;
        const cardText = p.finished ? '👁️' : p.cards;
        const rank = state.finished && state.finished.indexOf(p.name) !== -1 ? `<span class="rank-badge">#${state.finished.indexOf(p.name)+1}</span>` : '';
        return `<div class="seat ${pos[i]}"><div class="${cls}" style="position:relative;">${rank}<div>${icon} ${name}</div><div class="seat-cards">${cardText}</div></div></div>`;
    }).join('');

    // Direction arrows
    const cw = state.direction === 1;
    document.getElementById('arrTop').textContent = cw ? '→' : '←';
    document.getElementById('arrRight').textContent = cw ? '↓' : '↑';
    document.getElementById('arrBottom').textContent = cw ? '←' : '→';
    document.getElementById('arrLeft').textContent = cw ? '↑' : '↓';

    // Info
    document.getElementById('direction').textContent = cw ? '➡️ Clockwise' : '⬅️ Counter-clockwise';
    const turnEl = document.getElementById('turnIndicator');
    if (state.is_your_turn) {
        turnEl.className = 'turn-indicator';
        turnEl.textContent = '🟢 Your Turn!';
    } else {
        turnEl.className = 'not-your-turn';
        turnEl.textContent = `⏳ ${state.current_player}'s turn`;
    }

    // Deck
    document.getElementById('deckCount').textContent = `${state.deck_count} left`;
    const deckCard = document.getElementById('deckCard');
    deckCard.className = state.is_your_turn ? 'deck-card' : 'deck-card disabled';

    // Top card
    const topEl = document.getElementById('topCard');
    const tc = state.top_card;
    const eColor = tc.effective_color || tc.color;
    topEl.className = `top-card color-${eColor}`;
    const topCorner = getCornerText(tc.type);
    topEl.innerHTML = `<span class="card-corner tl" style="position:absolute;top:5px;left:6px;font-size:0.65rem;z-index:2;">${topCorner}</span><div class="card-value" style="font-size:2rem;position:relative;z-index:2;text-shadow:2px 2px 0 rgba(0,0,0,0.2);">${getCardSymbol(tc.type)}</div><span class="card-corner br" style="position:absolute;bottom:5px;right:6px;font-size:0.65rem;z-index:2;transform:rotate(180deg);">${topCorner}</span>`;

    // Hand
    const handDiv = document.getElementById('hand');
    handDiv.innerHTML = state.hand.map((c, i) => {
        const playable = c.playable && state.is_your_turn;
        const cls = playable ? 'card playable' : 'card disabled';
        const corner = getCornerText(c.type);
        return `<div class="${cls} color-${c.color}" onclick="${playable ? `playCard(${i})` : ''}" title="${c.label}">
            <span class="card-corner tl">${corner}</span>
            <div class="card-value">${getCardSymbol(c.type)}</div>
            <div class="card-type">${c.color === 'Wild' ? '' : ''}</div>
            <span class="card-corner br">${corner}</span>
        </div>`;
    }).join('');
    document.getElementById('handLabel').textContent = `Your Hand (${state.hand.length} cards)`;

    // Messages
    if (state.messages && state.messages.length) {
        const msgDiv = document.getElementById('messages');
        msgDiv.innerHTML = state.messages.map(m => `<p>${m}</p>`).join('');
        msgDiv.scrollTop = msgDiv.scrollHeight;
    }

    // Winner
    if (state.game_over) {
        document.getElementById('winnerText').textContent = state.winner === state.player_name ? '🏆 You Win!' : `🏆 ${state.winner} Wins!`;
        document.getElementById('winnerOverlay').classList.add('active');
    }
}

function playCard(index) {
    if (!isMyTurn) return;
    // Check if wild — need color picker
    const cards = document.querySelectorAll('.hand .card');
    const card = cards[index];
    if (card && card.classList.contains('color-Wild')) {
        pendingCardIndex = index;
        document.getElementById('colorPicker').classList.add('active');
        return;
    }
    socket.emit('play_card', { code: roomCode, card_index: index });
}

function pickColor(color) {
    document.getElementById('colorPicker').classList.remove('active');
    socket.emit('play_card', { code: roomCode, card_index: pendingCardIndex, color: color });
    pendingCardIndex = null;
}

function drawCard() {
    if (!isMyTurn) return;
    socket.emit('draw_card', { code: roomCode });
}

// --- CHAT ---
let chatOpen = false;
let unreadCount = 0;

function toggleChat() {
    chatOpen = !chatOpen;
    document.getElementById('chatBox').classList.toggle('active', chatOpen);
    if (chatOpen) {
        unreadCount = 0;
        document.getElementById('chatBadge').classList.remove('show');
        document.getElementById('chatInput').focus();
    }
}

function sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg || !roomCode) return;
    socket.emit('chat_message', { code: roomCode, message: msg });
    input.value = '';
}

function addChatMessage(name, message) {
    const div = document.getElementById('chatMessages');
    const isMe = name === myName;
    div.innerHTML += `<div class="chat-msg"><span class="chat-name ${isMe ? 'me' : ''}">${name}:</span><div class="chat-text">${message}</div></div>`;
    div.scrollTop = div.scrollHeight;
    if (!chatOpen) {
        unreadCount++;
        const badge = document.getElementById('chatBadge');
        badge.textContent = unreadCount;
        badge.classList.add('show');
    }
}

// --- SOCKET EVENTS ---
socket.on('room_created', (data) => {
    roomCode = data.code;
    isHost = true;
    document.getElementById('roomCode').textContent = data.code;
    document.getElementById('hostControls').style.display = 'block';
    document.getElementById('waitingMsg').style.display = 'none';
    document.getElementById('chatToggle').style.display = 'block';
    renderLobby(data.players);
    showScreen('lobbyScreen');
});

socket.on('room_update', (data) => {
    roomCode = data.code;
    renderLobby(data.players);
    document.getElementById('chatToggle').style.display = 'block';
    if (!isHost) showScreen('lobbyScreen');
});

socket.on('game_started', () => {
    showScreen('gameScreen');
});

socket.on('game_state', (state) => {
    showScreen('gameScreen');
    renderState(state);
});

socket.on('error', (data) => {
    showToast(data.msg);
});

socket.on('chat_message', (data) => {
    addChatMessage(data.name, data.message);
});
</script>
</body>
</html>
